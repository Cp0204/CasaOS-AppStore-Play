name: Release v1 store

# Builds the v1 (zip) app store packages that older CasaOS clients pull from:
#   https://play.cuse.eu.org/Cp0204-AppStore-Play.zip
#   https://play.cuse.eu.org/Cp0204-AppStore-Play-{arm,arm64,amd64}.zip
#
# The v2 store (index.json / dist) is built separately by release-v2.yml.
# Both workflows are idempotent and update the same rolling `new` release, so
# either one can run first.

permissions:
  contents: write

on:
  push:
    paths:
      - '**.yml'
      - '**.json'
      - '!Apps_pre/**'
      - '!dist/**'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tags'
        required: false
        type: string

# Shared with release-v2.yml so the two never fight over the `new` release.
concurrency:
  group: appstore-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Number of commits to fetch. 0 indicates all history for all branches and tags.

      - name: Get Commit Messages
        id: get_commit_messages
        run: |
          LATEST_TAG=$(git tag --sort=-creatordate | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log -1 --pretty=format:'- %s (%h)')
          else
            COMMITS=$(git log --pretty=format:'- %s (%h)' --no-merges "$LATEST_TAG"..HEAD)
          fi
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "release_date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Build v1 store packages
        id: build_v1
        run: |
          bash Tools/build_v1_store.sh
          # Proxy get.docker.com
          wget https://get.docker.com -O get_docker.sh

      - name: Publish v1 store assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITS: ${{ steps.get_commit_messages.outputs.commits }}
          RELEASE_DATE: ${{ steps.get_commit_messages.outputs.release_date }}
          APP_COUNTS: ${{ steps.build_v1.outputs.app_counts }}
        run: |
          TAG=new
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "v$RELEASE_DATE" --notes "v1 + v2 app store"
          fi
          BODY=$(printf "## What's Changed\n\n%s\n\n📊 **v1 App Counts:** %s" "$COMMITS" "$APP_COUNTS")
          gh release edit "$TAG" --title "v$RELEASE_DATE" --notes "$BODY"
          gh release upload "$TAG" \
            AppStore.zip \
            AppStore_arm.zip \
            AppStore_arm64.zip \
            AppStore_amd64.zip \
            --clobber

      - name: Upload to OSS
        id: upload_to_oss
        uses: tvrcgo/upload-to-oss@master
        with:
          key-id: ${{ secrets.OSS_KEY_ID }}
          key-secret: ${{ secrets.OSS_KEY_SECRET }}
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          bucket: ${{ secrets.OSS_BUCKET }}
          assets: |
            AppStore.zip:Cp0204-AppStore-Play.zip
            AppStore_arm.zip:Cp0204-AppStore-Play-arm.zip
            AppStore_arm64.zip:Cp0204-AppStore-Play-arm64.zip
            AppStore_amd64.zip:Cp0204-AppStore-Play-amd64.zip
            get_docker.sh:get_docker.sh
            Tools/get_casaos.sh:get_casaos.sh
            Tools/casaos_newbie.sh:casaos_newbie.sh
            Tools/YAML-Generator.html:generate/index.html

      - name: Cloudflare Purge Cached
        run: |
          # https://developers.cloudflare.com/api/operations/zone-purge#purge-cached-content-by-url
          response=$(curl --silent --request POST \
            --url https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache \
            --header 'Content-Type: application/json' \
            --header 'X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}' \
            --header 'X-Auth-Key: ${{ secrets.CLOUDFLARE_API_KEY }}' \
            --data '{"purge_everything": true}')
          if echo "$response" | grep -q '"success":false'; then
            echo "Cloudflare Purge Cached Failed: $response"
            exit 1
          else
            echo "Cloudflare Purge Cached Success."
          fi
